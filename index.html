// ---------------- main loop ----------------
let last = performance.now(), fps = 60, fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  tick(dt); render();
  requestAnimationFrame(frame);
}
function tick(dt) {
  state.t += dt;
  chatPanel(state.net && ['carselect', 'trackselect', 'netwait', 'results', 'race'].includes(state.screen) && !state.notice && !(RR.MOBILE && ['trackselect', 'results', 'race'].includes(state.screen)), state.screen === 'trackselect' || state.screen === 'race' ? 'bl' : state.screen === 'results' ? 'bc' : '');
  if (state.songToast) state.songToast.t -= dt;
  pollPadsForMenu(dt); if (state.padToast) state.padToast.t -= dt;
  if (state.screen === 'cutscene' && state.cut) { state.cut.update(dt); if (state.cut.done) endCut(); }
  if (state.screen === 'title' && state.t > 3) go('menu');
  A.setPaused(state.screen === 'race' && state.paused);
  if ((state.musicWatchT = (state.musicWatchT || 0) + dt) > 0.5) { state.musicWatchT = 0; A.musicWatch(); }
  if (state.screen === 'results' && state.race && state.race.mode === 'net' && NET.role === 'host' && state.race.cars.some(c => c.netBot && !c.puppet && !c.finished) && state.race.time < 600) {
    const race = state.race; state.acc += dt; netTick(race, dt);
    while (state.acc >= RR.SIM_DT) { RR.step(race, RR.SIM_DT, []); handleEvents(race); state.acc -= RR.SIM_DT; }
  }
  if (state.screen === 'race' && state.race && (!state.paused || state.race.mode === 'net')) {
    const race = state.race;
    state.acc += dt;
    const inputs = [playerInput(0), playerInput(1)];
    netTick(race, dt);
    while (state.acc >= RR.SIM_DT) {
      const replay = race.video && state.videoMode === 'replay';
      RR.step(race, RR.SIM_DT, replay ? [videoInput(race)] : inputs); handleEvents(race); state.acc -= RR.SIM_DT;
      if (replay) {
        const V = RR.VIDEO_TEST, f = videoFrame(race), c = race.cars[0];
        race.gapSum = (race.gapSum || 0) + Math.hypot(c.x - V.x[f], c.y - V.y[f]); race.gapN = (race.gapN || 0) + 1;
        race.syncI = race.syncI || 0;
        if (race.syncI < V.syncFrames.length && f >= V.syncFrames[race.syncI]) { race.syncI++; videoSync(race); }
        if (race.syncFlash > 0) race.syncFlash -= RR.SIM_DT;
        if (f >= V.replayEnd) { state.videoMode = 'drive'; notice('Replay finished: on average my car was ' + (race.gapSum / race.gapN).toFixed(0) + ' px from yours\n(the car is about 26 px long; it was re-aligned about every 3 s).\nYou can drive now.' + (RR.MOBILE ? '\nPause > Restart starts a free drive.' : ' R replays again, F restarts the free drive.') + ''); break; }
      }
    }
    fxUpdate(race, dt);
    state.cams.forEach((cam, i) => {
      const c = cam.car, Z = RR.ZOOM, tx = c.x + Math.max(-70 * Z, Math.min(70 * Z, c.vx * 0.45)), ty = c.y + Math.max(-55 * Z, Math.min(55 * Z, c.vy * 0.45));
      const k = 1 - Math.exp(-6 * dt); if (Math.hypot(tx - cam.x, ty - cam.y) > 260) { cam.x = tx; cam.y = ty; } cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;

}
function flushSkids(race) { race.skidQueue.length = 0; }
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;

    case 'menu': menuBG(); if (RR.MOBILE) drawLogo(VW / 2, 120, 1.0); else drawLogo(VW / 2, 56, 0.95); drawButtons(); drawTribute(); drawVersion(); break;
    case 'options': menuBG(); title('Options', 24); drawButtons();
      ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#ffb0a0'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
      if (!RR.MOBILE) ctx.fillText('Settings below the line are PC additions (not in the original).  Left/Right changes volume.', VW / 2, 138);
      ctx.restore(); break;
    case 'carselect': drawCarSelect(); break;
    case 'camp': drawCamp(); break;
    case 'drift': drawDrift(); break;
    case 'challenges': drawChallenges(); break;
    case 'boards': drawBoards(); break;
    case 'news': drawNews(); break;
    case 'cutscene': ctx.setTransform(S, 0, 0, S, 0, 0); state.cut.draw(ctx, VW, VH, id => carSprites[id]); break;
    case 'trackselect': menuBG(); title(state.net ? 'Wi-Fi Race - Choose Race' : state.twoPlayer ? '2 Player - Choose Race' : 'Choose Race', 22); drawButtons(); break;
    case 'netwait': menuBG(); title('Wi-Fi Race', 40);
      ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 13px "Trebuchet MS",sans-serif';
      ctx.fillText('Connected!', VW / 2, VH / 2 - 20); ctx.fillStyle = '#bcd0ff'; ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
      ctx.fillText('Waiting for the host to pick a race' + '...'.slice(0, 1 + ((state.t * 2) | 0) % 3), VW / 2, VH / 2);
      ctx.fillStyle = '#9fe9ff'; ctx.fillText('In this room: ' + (NET.rosterList || []).map(p => pname(p.id) + (p.id === NET.myId ? ' (you)' : '') + (p.car == null ? ' - picking' : ' - ' + RR.CARS[p.car].name.replace('Team ', ''))).join('   '), VW / 2, VH / 2 + 20); ctx.restore(); drawButtons(); break;
    case 'race': {
      const race = state.race; flushSkids(race);
      if (state.cams.length === 1) drawView(race, state.cams[0], 0, 0, VW, VH);
      else { drawView(race, state.cams[0], 0, 0, VW / 2 - 1, VH); drawView(race, state.cams[1], VW / 2 + 1, 0, VW / 2 - 1, VH);
        ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#111'; ctx.fillRect(VW / 2 - 1, 0, 2, VH); }

      else if (state.paused) { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH); title('Paused', RR.MOBILE ? 112 : 56); drawButtons(); if (!RR.MOBILE) hintText('1-7 change song   |   - / + music volume   |   [ / ] sound volume', 205); else hintText('Tap the left / right side of Song to change it', 372); }

}
requestAnimationFrame(frame);

// ---------------- test / debug hooks ----------------
RR.test = {
  save: () => save, persist, go, net: { hostRoom: (c, m) => hostRoom(c, m), joinRoom: c => joinRoom(c, t => { window.__netStatus = t; }), state: () => ({ ok: NET.ok, role: NET.role, myId: NET.myId, peers: NET.peers.length, roster: NET.rosterList, chat: NET.chat.map(c => c.id + ':' + c.text) }), toCars: () => { state.net = true; NET.ok = true; netOverlayClose(); go('carselect'); }, chat: w => sendChat(w), pickCustom: d => netPickRace(-1, d) }, pickCar: () => pickCar(), camp: { open: () => openCamp(), pick: k => campPick(k), start: k => { state.campK = k; startCampRace(); }, beat: list => { campSave().beaten = list; persist(); }, cut: () => state.cut && { i: state.cut.i, n: state.cut.shots.length, kind: state.cut.shot().kind } }, playCustom: (d, h) => playCustom(d, h), activate: i => activate(buttons()[i]), loadGhost: i => loadGhost(i), buttonsList: () => buttons().map(b => ({ label: b.label, x: b.x, y: b.y, w: b.w, h: b.h })), startRace: (ti, seed, opts) => { if (opts) Object.assign(state, opts); startRace(ti, seed); },
  // run the current race headless with every car (incl. players) autopiloted
  simulate(seconds, autopilotPlayers) {
    const race = state.race; if (autopilotPlayers) race.cars.forEach(c => c.ai = true);
    race.cars.forEach(c => { if (c.ai && c.aiOffset == null) c.aiOffset = 0; });
    const n = Math.round(seconds / RR.SIM_DT);
    for (let i = 0; i < n && race.phase !== 'finished'; i++) RR.step(race, RR.SIM_DT, [playerInput(0), playerInput(1)]);
    return RR.test.summary();
  },
  summary() {
    const race = state.race;
    return { phase: race.phase, time: race.time, L: race.T.L, cars: RR.standings(race).map(c => ({ id: c.id, player: c.player, lap: c.lap, prog: Math.round(c.progress), fin: c.finished ? +c.finishTime.toFixed(2) : null, x: Math.round(c.x), y: Math.round(c.y), stuck: c.stuckT })) };
  },
  finishNow: () => { if (state.race) { state.race.phase = 'finished'; state.race.endT = 0; } },
  startCampRace: () => startCampRace(),
  keys, state, tick: (dt) => tick(dt),
};
})();
