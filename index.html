    if ((code === 'Escape' || code === 'KeyP') && state.race.phase !== 'finished') { state.paused = true; state.focus = 0; A.play('back'); }
    return;
  }
  if (state.screen === 'race' && state.paused && state.pauseOpts && (code === 'Escape' || code === 'Backspace')) { state.pauseOpts = false; state.focus = 3; A.play('back'); return; }
  if (state.screen === 'race' && state.paused && (code === 'Escape' || code === 'KeyP')) { state.paused = false; state.pauseOpts = false; clearInput(); return; }
  const b = buttons();
  const fb = b[state.focus];
  if (fb && fb.vol && (code === 'ArrowLeft' || code === 'KeyA' || code === 'ArrowRight' || code === 'KeyD')) { adjustVol(fb.vol, (code === 'ArrowLeft' || code === 'KeyA') ? -1 : +1); return; }
  if (state.screen === 'carselect' && (code === 'ArrowLeft' || code === 'KeyA')) { cycleCar(-1); A.play('menu'); return; }
  if (state.screen === 'carselect' && (code === 'ArrowRight' || code === 'KeyD')) { cycleCar(1); A.play('menu'); return; }
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
  if (dirs[code] && b.length) {

    let best = -1, bd = 1e9;
    b.forEach((o, i) => {

    if (state.screen === 'carselect' && state.selPlayer === 1) { state.selPlayer = 0; return; }
    if (back) { A.play('back'); go(back); }

}

// ---------------- race management ----------------
function startRace(ti, seed) {

  state.race = RR.createRace({ trackIndex: ti, players, twoPlayer: state.twoPlayer, raceSeed: seed });
  state.cams = state.race.cars.filter(c => c.player >= 0).sort((a, b) => a.player - b.player).map(c => ({ car: c, x: c.x, y: c.y }));
  state.screen = 'race'; state.focus = 0; state.acc = 0; state.result = null;

  for (let i = 0; i < 240 / RR.SIM_DT && race.cars.some(c => !c.finished); i++) { race.phase = 'racing'; RR.step(race, RR.SIM_DT, []); }
  race.phase = 'finished';

  const res = { standings: st.map(c => ({ name: c.player >= 0 ? (race.twoPlayer ? 'P' + (c.player + 1) : 'YOU') : c.liv.name, liv: c.liv, time: c.finished ? c.finishTime : null, player: c.player })), stars: 0, unlockedNext: false };

    const doneBefore = racesDone();
    if (res.stars > save.stars[i]) save.stars[i] = res.stars;
    if (players[0].finished && (!save.best[i] || players[0].finishTime < save.best[i])) save.best[i] = players[0].finishTime;
    if (pos <= 3 && i + 1 > save.unlocked && i < 17) { save.unlocked = i + 1; res.unlockedNext = true; }
    const newCars = RR.CARS.filter(c => c.unlock && doneBefore < c.unlock && racesDone() >= c.unlock);
    if (newCars.length) res.newCar = newCars.map(c => c.name).join(' & ');

}

function handleEvents(race) {
  for (const e of race.events) {
    const mine = e.car && e.car.player >= 0;
    if (e.type === 'buzz') A.play('buzz_full');
    else if (e.type === 'finalLap') A.say('Final lap');
    else if (e.type === 'pickup' && mine) { A.play(e.kind === 'N' ? 'nitro' : 'pickup'); A.say(RR.PICKUPS[e.kind].voice); }
    else if (e.type === 'wall' && mine) A.play('wall', e.power);
    else if (e.type === 'car' && (mine || (e.other && e.other.player >= 0))) A.play('car', e.power);

}
function drawTrackTile(b) {
  const i = b.track;

  ctx.font = 'bold 16px "Trebuchet MS","Segoe UI",Verdana,sans-serif'; ctx.fillText(b.locked ? '🔒' : b.label, b.x + b.w / 2, b.y + 18);
  if (!state.twoPlayer) for (let k = 0; k < 3; k++) star(b.x + b.w / 2 - 14 + k * 14, b.y + 38, 5.5, save.stars[i] > k);
  else { ctx.font = '8px sans-serif'; ctx.fillText('RACE ' + (i + 1), b.x + b.w / 2, b.y + 38); }

function hintText(s, y) {

  ctx.font = 'bold 9px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillText(s, VW / 2, y); ctx.restore();

function drawSongToast() {
  const st = state.songToast; if (!st || st.t <= 0 || state.pauseOpts) return;

  const y = state.screen === 'race' ? (RR.MOBILE ? 72 : 36) : (RR.MOBILE ? VH - 6 : VH - 30);
  const bh = RR.MOBILE && state.screen !== 'race' ? 11 : 18; ctx.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(ctx, VW / 2 - w / 2, y - bh / 2, w, bh, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, VW / 2, y + 1); ctx.restore();
}
function title(t, y) {
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 18px "Trebuchet MS","Segoe UI",Verdana,sans-serif'; ctx.fillText(t, VW / 2, y); ctx.restore();
}
function drawButtons() { buttons().forEach((b, i) => drawButton(b, i === state.focus)); }

const carSprites = RR.CARS.map(c => RR.makeCarSprite(c));
// stat stars = the car's stat levels (1-3)
function statStars(key, id) { const c = RR.CARS[id]; return key === 'top' ? c.ts : key === 'acc' ? c.ac : c.ti; }
function smallStars(n, xRight, y) {
  ctx.fillStyle = '#fff';
  for (let k = 0; k < n; k++) { const cx = xRight - k * 10; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 1.9 : 4.4; ctx.lineTo(cx + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.fill(); }
}
function drawCarSelect() {
  menuBG();
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  roundRect(ctx, VW / 2 - 120, 6, 240, 30, 9); ctx.fillStyle = '#6e0a08'; ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = '#ff2c1e'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 16px "Trebuchet MS","Segoe UI",sans-serif';

  if (carLocked(id)) {

    ctx.fillText('Finish ' + cd.unlock + ' races in the top 3 (' + racesDone() + '/' + cd.unlock + ')', lx, ly + 11);
  }

function drawResults() {
  const r = state.result, race = state.race;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#0d1a4a'; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(120,150,255,0.10)'; (RR.MOBILE ? [20, 60, 100, 170, 210, 250] : [40, 100, 150, 330, 380, 440]).forEach(x => ctx.fillRect(x, 0, 2, VH));
  ctx.save();
  const players = r.standings.map((s, i) => ({ s, pos: i + 1 })).filter(o => o.s.player >= 0);
  const best = save.best[race.trackIndex];
  if (!race.twoPlayer) {
    const p = r.pos, num = String(p), suf = ordinal(p), sc = 13;
    const w = RR.textWidth(num, sc) + 6 + RR.textWidth(suf, 5), x0 = Math.round(VW / 2 - w / 2);
    const top = RR.MOBILE ? 70 : 20;
    RR.pixText(ctx, num, x0, top, sc, '#ffffff');
    RR.pixText(ctx, suf, x0 + RR.textWidth(num, sc) + 6, top + 7 * sc - 35, 5, '#ffffff');
    if (r.stars) smallStars(r.stars, x0 + w - 4, top + 10);
    const LX = RR.MOBILE ? 30 : 120, RX = RR.MOBILE ? 240 : 360, TY = RR.MOBILE ? 230 : 132;
    const me = players[0].s;
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 17px "Trebuchet MS","Segoe UI",sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Time', LX, TY);
    ctx.textAlign = 'right'; ctx.fillText(me.time != null ? fmtTime(me.time) : '--:--.--', RX, TY);
    ctx.font = 'bold 10px "Trebuchet MS","Segoe UI",sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Best Time', LX, TY + 18);
    ctx.textAlign = 'right'; ctx.fillText(best ? fmtTime(best) : '--:--.--', RX, TY + 18);
    ctx.textAlign = 'center'; ctx.font = 'bold 10px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillStyle = '#bcd0ff';
    const msg = 'Race ' + (race.trackIndex + 1) + ' — ' + (p <= 3 ? (r.unlockedNext ? 'Race ' + (race.trackIndex + 2) + ' unlocked!' : 'Qualified') : 'Finish in the top 3 to qualify');
    ctx.fillText(msg, VW / 2, RR.MOBILE ? 290 : 176);
    if (r.newCar) { ctx.fillStyle = '#ffcf40'; ctx.font = 'bold 12px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillText('New car unlocked: ' + r.newCar + '!', VW / 2, RR.MOBILE ? 312 : 194); }
  } else {
    players.forEach((o, k) => {

      const w = RR.textWidth(num, sc) + 4 + RR.textWidth(suf, 3), x0 = Math.round(cx - w / 2);
      RR.pixText(ctx, num, x0, 34, sc, '#fff'); RR.pixText(ctx, suf, x0 + RR.textWidth(num, sc) + 4, 34 + 63 - 21, 3, '#fff');
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 13px "Trebuchet MS",sans-serif'; ctx.textBaseline = 'middle';
      ctx.fillText(o.s.name + ' — ' + (o.s.time != null ? fmtTime(o.s.time) : '--:--.--'), cx, 120);
    });
    ctx.fillStyle = '#bcd0ff'; ctx.font = 'bold 10px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Race ' + (race.trackIndex + 1), VW / 2, 176);
  }
  ctx.restore();
  drawButtons();
}

// Credit to the original game, under Achievements: shows 10 s, hides 10 s, repeating (with a short fade).
function drawTribute() {
  const cyc = (performance.now() / 1000) % 20; if (cyc >= 10) return;
  const a = Math.min(1, cyc / 0.5, (10 - cyc) / 0.5);
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = a;
  ctx.font = 'bold 8px "Trebuchet MS","Segoe UI",sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const l1 = 'Based on Retro Racing (2012)', l2 = 'by Mr Qwak - fan recreation';
  const w = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + 12;
  const R = VW - 8;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(ctx, R - w, 30, w, 24, 5); ctx.fill();
  ctx.fillStyle = '#ffd8cc'; ctx.fillText(l1, R - 6, 37); ctx.fillStyle = '#ffb0a0'; ctx.fillText(l2, R - 6, 47);
  ctx.restore();
}
function drawTouchControls() {
  // Styled after the original iPhone version: big translucent rounded triangles, no button boxes.
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const tri = (pts, fill, stroke, lw) => {          // rounded-corner triangle, single fill (no double-alpha edge)
    const r = 6; ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const p = pts[k], n = pts[(k + 1) % 3], m = [(p[0] + n[0]) / 2, (p[1] + n[1]) / 2];
      if (k === 0) { const pv = pts[2]; ctx.moveTo((pv[0] + p[0]) / 2, (pv[1] + p[1]) / 2); }
      ctx.arcTo(p[0], p[1], m[0], m[1], r);
    }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  };
  const L = TOUCH.left, R = TOUCH.right, G = TOUCH.gas;
  const lcx = L.x + L.w / 2, lcy = L.y + L.h / 2, rcx = R.x + R.w / 2, rcy = R.y + R.h / 2, gcx = G.x + G.w / 2, gcy = G.y + G.h / 2;
  // all three arrows share one look (as in the original): light grey translucent fill, darker grey rim
  const fill = on => on ? 'rgba(240,240,240,0.72)' : 'rgba(210,210,210,0.5)', rim = 'rgba(80,80,80,0.5)';
  const aw = RR.MOBILE ? 27 : L.w * 0.40, ah = RR.MOBILE ? 30 : L.h * 0.30;
  tri([[lcx - aw, lcy], [lcx + aw, lcy - ah], [lcx + aw, lcy + ah]], fill(touchHeld.left), rim, 4);
  tri([[rcx + aw, rcy], [rcx - aw, rcy - ah], [rcx - aw, rcy + ah]], fill(touchHeld.right), rim, 4);
  const gw = RR.MOBILE ? 32 : G.w * 0.36, gh = RR.MOBILE ? 30 : G.h * 0.30;
  tri([[gcx, gcy - gh], [gcx + gw, gcy + gh], [gcx - gw, gcy + gh]], fill(touchHeld.gas), rim, 4);
  for (const [b, label] of [[TOUCH.pause, 'II'], [TOUCH.song, '\u266A']]) {
    ctx.fillStyle = 'rgba(40,40,40,0.55)'; roundRect(ctx, b.x, b.y, b.w, b.h, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  ctx.restore();
}
function drawRotate() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1a0303'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold ' + Math.round(canvas.width / 14) + 'px "Trebuchet MS",sans-serif';
  ctx.fillText('Turn your phone sideways', canvas.width / 2, canvas.height / 2 - canvas.width / 12);
  ctx.font = Math.round(canvas.width / 22) + 'px "Trebuchet MS",sans-serif'; ctx.fillText('Retro Racing plays in landscape', canvas.width / 2, canvas.height / 2 + canvas.width / 20);
  ctx.restore();
}
function drawInfo() {
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = 'rgba(3,7,26,0.97)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillText('Controls & Credits', VW / 2, 22);
  const sec = (title, lines, y) => {
    ctx.fillStyle = '#8ab4ff'; ctx.font = 'bold 11px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillText(title, VW / 2, y);
    ctx.fillStyle = '#f0f0f0'; ctx.font = '9px "Trebuchet MS","Segoe UI",sans-serif';
    const wrapped = [];
    for (const l of lines) { let cur = ''; for (const w of l.split(' ')) { const tryL = cur ? cur + ' ' + w : w; if (ctx.measureText(tryL).width > VW - 20 && cur) { wrapped.push(cur); cur = w; } else cur = tryL; } wrapped.push(cur); }
    wrapped.forEach((l, k) => ctx.fillText(l, VW / 2, y + 13 + k * 11)); return y + 13 + wrapped.length * 11 + 8;
  };
  let y = 48;
  if (RR.MOBILE) y = sec('Touch controls', ['Bottom-left arrows steer, bottom-right button accelerates (hold)', 'II pauses, \u266A skips to the next song, Song in Pause / Options picks one', 'Bluetooth controllers also work'], y);
  else y = sec('Controls', ['1 Player: Arrows or WASD steer, Up / W / Z / X / Space accelerate',
                       '2 Player: P1 A / D steer + W accelerate, P2 Left / Right + Up accelerate',
                       'Esc or P pause   |   Gamepad: stick / D-pad steer, A or RT accelerate'], y);
  if (!RR.MOBILE) y = sec('Hotkeys', ['1-7 change song   |   - / + music volume   |   [ / ] sound volume   |   F3 telemetry'], y);
  y = sec('Music (supplied by Anthony)', ['Waves (main screen)   |   Empty, Pocket 2, Wasted Time, Rally, Rally 3, Stored 2'], y);
  y = sec('Sounds', ['Engine loop by qubodup, tyre squeal by audible-edge (CC-BY 3.0)', 'Pickup, nitro, cone and finish sounds by Kenney.nl (CC0)   |   Buzzer, clicks, collision by Anthony'], y);
  ctx.fillStyle = '#a9c2ff'; ctx.font = '9px "Trebuchet MS","Segoe UI",sans-serif'; ctx.fillText('(click or press Enter / Esc to close)', VW / 2, VH - 14);
  ctx.restore();
}
function drawNotice() {
  ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VW, VH);
  if (RR.MOBILE) roundRect(ctx, 15, 190, 240, 100, 10); else roundRect(ctx, 90, 90, 300, 90, 10);
  ctx.fillStyle = '#5a0606'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ff2c1e'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 11px "Trebuchet MS",sans-serif';
  if (RR.MOBILE) ctx.font = 'bold 10px "Trebuchet MS",sans-serif';
  state.notice.split('\n').forEach((l, i) => ctx.fillText(l, VW / 2, (RR.MOBILE ? 222 : 120) + i * 16));
  ctx.font = '9px sans-serif'; ctx.fillStyle = '#ffb0a0'; ctx.fillText(RR.MOBILE ? '(tap)' : '(click / Enter)', VW / 2, RR.MOBILE ? 276 : 166);
  ctx.restore();
}

// ---------------- main loop ----------------
let last = performance.now(), fps = 60, fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  tick(dt); render();
  requestAnimationFrame(frame);
}
function tick(dt) {
  state.t += dt;
  if (state.songToast) state.songToast.t -= dt;
  pollPadsForMenu();
  if (state.screen === 'title' && state.t > 3) go('menu');
  A.setPaused(state.screen === 'race' && state.paused);
  if ((state.musicWatchT = (state.musicWatchT || 0) + dt) > 0.5) { state.musicWatchT = 0; A.musicWatch(); }
  if (state.screen === 'race' && state.race && !state.paused) {
    const race = state.race;
    state.acc += dt;
    const inputs = [playerInput(0), playerInput(1)];
    while (state.acc >= RR.SIM_DT) { RR.step(race, RR.SIM_DT, inputs); handleEvents(race); state.acc -= RR.SIM_DT; }
    state.cams.forEach((cam, i) => {
      const c = cam.car, Z = RR.ZOOM, tx = c.x + Math.max(-70 * Z, Math.min(70 * Z, c.vx * 0.45)), ty = c.y + Math.max(-55 * Z, Math.min(55 * Z, c.vy * 0.45));
      const k = 1 - Math.exp(-6 * dt); if (Math.hypot(tx - cam.x, ty - cam.y) > 260) { cam.x = tx; cam.y = ty; } cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
      if (A.ctx) A.updateEngine(i, Math.hypot(c.vx, c.vy), c.throttle, c.slip, c.base.top);
    });
    if (race.phase === 'finished' && race.endT <= 0) finishRace();
  }
}
function flushSkids(race) {
  const v = race.T.vis.getContext('2d'); v.fillStyle = 'rgba(50,50,50,0.22)';
  for (const [x, y, a] of race.skidQueue) {
    const fx = Math.sin(a), fy = -Math.cos(a), rx = Math.cos(a), ry = Math.sin(a);
    for (const s of [-7, 7]) v.fillRect(Math.round(x + rx * s - fx * 9) - 1, Math.round(y + ry * s - fy * 9) - 1, 3, 2);
  }
  race.skidQueue.length = 0;
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  switch (state.screen) {
    case 'title': menuBG(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = 'rgba(20,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH); drawLogo(VW / 2, VH / 2 - 6, 1.5); break;
    case 'menu': menuBG(); if (RR.MOBILE) drawLogo(VW / 2, 120, 1.0); else drawLogo(VW / 2, 56, 0.95); drawButtons(); drawTribute(); break;
    case 'options': menuBG(); title('Options', 24); drawButtons();
      ctx.save(); ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#ffb0a0'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
      if (!RR.MOBILE) ctx.fillText('Settings below the line are PC additions (not in the original).  Left/Right changes volume.', VW / 2, 144);
      ctx.restore(); break;
    case 'carselect': drawCarSelect(); break;
    case 'trackselect': menuBG(); title(state.twoPlayer ? '2 Player - Choose Race' : 'Choose Race', 22); drawButtons(); break;
    case 'race': {
      const race = state.race; flushSkids(race);
      if (state.cams.length === 1) drawView(race, state.cams[0], 0, 0, VW, VH);
      else { drawView(race, state.cams[0], 0, 0, VW / 2 - 1, VH); drawView(race, state.cams[1], VW / 2 + 1, 0, VW / 2 - 1, VH);
        ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#111'; ctx.fillRect(VW / 2 - 1, 0, 2, VH); }
      if (RR.MOBILE && !state.paused) drawTouchControls();
      if (state.paused && state.pauseOpts) { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = 'rgba(3,7,26,0.88)'; ctx.fillRect(0, 0, VW, VH); title('Options', 24); drawButtons(); }
      else if (state.paused) { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH); title('Paused', RR.MOBILE ? 112 : 56); drawButtons(); if (!RR.MOBILE) hintText('1-7 change song   |   - / + music volume   |   [ / ] sound volume', 205); else hintText('Tap the left / right side of Song to change it', 372); }
      break;
    }
    case 'results': drawResults(); break;
  }
  drawSongToast();
  if (state.info) drawInfo();
  if (state.notice) drawNotice();
}
requestAnimationFrame(frame);

// ---------------- test / debug hooks ----------------
RR.test = {
  save: () => save, persist, go, startRace: (ti, seed, opts) => { if (opts) Object.assign(state, opts); startRace(ti, seed); },
  // run the current race headless with every car (incl. players) autopiloted
  simulate(seconds, autopilotPlayers) {
    const race = state.race; if (autopilotPlayers) race.cars.forEach(c => c.ai = true);
    race.cars.forEach(c => { if (c.ai && c.aiOffset == null) c.aiOffset = 0; });
    const n = Math.round(seconds / RR.SIM_DT);
    for (let i = 0; i < n && race.phase !== 'finished'; i++) RR.step(race, RR.SIM_DT, [playerInput(0), playerInput(1)]);
    return RR.test.summary();
  },
  summary() {
    const race = state.race;
    return { phase: race.phase, time: race.time, L: race.T.L, cars: RR.standings(race).map(c => ({ id: c.id, player: c.player, lap: c.lap, prog: Math.round(c.progress), fin: c.finished ? +c.finishTime.toFixed(2) : null, x: Math.round(c.x), y: Math.round(c.y), stuck: c.stuckT })) };
  },
  finishNow: () => { if (state.race) { state.race.phase = 'finished'; state.race.endT = 0; } },
  keys, state, tick: (dt) => tick(dt),
};
})();
